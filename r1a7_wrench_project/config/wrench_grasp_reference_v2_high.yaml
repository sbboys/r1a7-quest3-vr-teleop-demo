notes:
- V2 fixes the low tabletop approach observed in V1 by selecting keyframes from right_wrist_pose height and gripper state.
- The first two stages keep the gripper open and move the right arm to an elevated approach posture.
- Closing is split into a separate stage so the arm does not slide while gripper force changes.
