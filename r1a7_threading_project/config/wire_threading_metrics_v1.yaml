schema_version: 1
protocol_date: "2026-10-27"
status: candidate
status_note: >-
  Thresholds are preregistration candidates, not verified hardware results.
  Activate them only after workpiece geometry, independent ground truth,
  synchronization, and success criteria are frozen.

trial:
  unit: independent_task_attempt
  pilot_repetitions_per_condition_min: 10
  formal_repetitions_per_critical_condition_min: 50
  randomize_or_interleave_method_order: true
  retain_failures_timeouts_and_stops: true
  timeout_s_candidate: 60.0
  max_recoveries_candidate: 2
  success_protrusion_mm_candidate: 2.0

frozen_conditions_required:
  - wire_diameter_mm
  - wire_material_and_batch
  - wire_free_length_mm
  - grasp_method_and_location
  - hole_diameter_mm
  - hole_thickness_mm
  - hole_chamfer_and_pose
  - camera_serials_resolution_fps_exposure
  - lighting
  - calibration_file_hashes
  - controller_git_commit_and_arguments
  - independent_ground_truth_method
  - clock_synchronization_method
  - success_and_failure_definition

candidate_thresholds:
  P01_wire_iou_min: 0.80
  P06_normal_visible_valid_observation_rate_min: 0.95
  P09_relative_visual_measurement_p95_mm_max: 0.05
  C01_valid_update_rate_hz_min: 20.0
  C02_capture_to_control_latency_p95_ms_max: 100.0
  M01_actual_transverse_alignment_p95_mm_max: 0.10
  M02_direction_error_p95_deg_max: 2.0
  M05_hold_duration_s: 2.0
  M05_hold_rms_mm_max: 0.03
  M07_stall_ratio_pct_max: 5.0
  T01_first_attempt_success_rate_min: 0.80
  T02_final_success_rate_min: 0.90
  T06_perturbation_success_rate_min: 0.80
  S01_anomaly_to_stop_command_p95_ms_max: 100.0
  S02_physical_stop_overtravel_mm_max: null

qualification_speed_levels_mm_s:
  - 0.2
  - 0.5
  - 1.0

ordinary_cartesian_baseline_mm_s: 10.0
ordinary_cartesian_baseline_note: >-
  Existing configuration and one operator-confirmed historical task result;
  not an insertion-speed qualification and not a precision claim.

quantile_method: nearest_rank
proportion_confidence_interval:
  method: wilson
  confidence: 0.95

failure_codes:
  - PERCEPTION_WIRE_LOST
  - PERCEPTION_TIP_LOST
  - PERCEPTION_HOLE_LOST
  - FALSE_VALID_STATE
  - CAMERA_STALE_OR_DESYNC
  - ALIGNMENT_NOT_CONVERGED
  - ARM_STALL
  - ARM_JUMP_OR_OSCILLATION
  - GRASP_MISS
  - WIRE_SLIP
  - WIRE_DAMAGE
  - CONTACT_JAM
  - MISSED_HOLE
  - TIMEOUT
  - SAFETY_STOP
  - OPERATOR_ABORT
  - LOGGING_INVALID
  - OTHER
